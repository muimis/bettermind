name: Build & Deploy to Cloudflare

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Acceptance Tests
        run: npm test

      - name: Verify TypeScript Types
        run: npx tsc --noEmit

      - name: Build OpenNext for Cloudflare
        run: npm run build

      - name: Check Cloudflare Secrets
        id: check_secrets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Cloudflare credentials found. Deploying to Cloudflare Workers."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning ::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing in GitHub Repository Secrets. Skipping automated deploy. Tests & build succeeded."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

