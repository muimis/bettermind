name: Deploy to Cloudflare

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Acceptance Tests
        run: npm test

      - name: Verify TypeScript Types
        run: npx tsc --noEmit

      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Check Cloudflare Credentials
        id: check_creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning ::CLOUDFLARE_API_TOKEN secret is not set. Deployment skipped. See docs/CLOUDFLARE_SETUP.md to configure secrets."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via Wrangler
        if: steps.check_creds.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
